server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 1: 引入系统自带的后缀字典
    include /etc/nginx/mime.types;

    # 2：教会它认识 .mjs 文件
    types {
        application/javascript mjs;
    }

    # 3. 解决单页应用 (SPA) 刷新报错 404 的问题
    location / {
        try_files $uri $uri/ /index.html;
    }
}