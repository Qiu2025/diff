server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 1: 引入系统自带的后缀字典
    include /etc/nginx/mime.types;

    # 2：教会它认识 .mjs 文件
    types {
        application/javascript mjs;
        application/octet-stream traineddata;
    }

    # The OCR engine and language data are several megabytes of text-like
    # binary; compressing them roughly halves the one-time download.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/wasm
        application/octet-stream
        image/svg+xml;

    # OCR assets are versioned by the image they ship in, so they can be
    # cached for a long time.
    location /ocr/ {
        add_header Cache-Control "public, max-age=604800";
    }

    # 3. 解决单页应用 (SPA) 刷新报错 404 的问题
    location / {
        try_files $uri $uri/ /index.html;
    }
}