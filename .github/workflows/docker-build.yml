name: Build and Push to Docker Hub

# 触发条件：当 push 到 main 分支时，自动触发
on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest # 白嫖 GitHub 的 Ubuntu 服务器

    steps:
      - name: 检出代码 (把代码拉到 GitHub 服务器上)
        uses: actions/checkout@v4

      - name: 准备 Docker 构建环境
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 编译并推送到 Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            qiu321/diff:latest